  { ref:"U3-29", q:"Arnove names three literacy campaigns as the most remarkable in the world. Which is NOT one of them?",
    o:["Cuba (1961)","Nicaragua (1980)","Tanzania (1970s)","Somalia (1973 and 1974)","If all of these are on his list, mark here"], c:3,
    why:"Arnove’s three are Cuba, Nicaragua and Tanzania. The Somali campaigns are Bhola’s example of the campaign approach, not on Arnove’s world list.",
    src:"Textbook §3.9.2" },
  { ref:"ART-u1c-Q11", q:"Which type of value relates to guidelines regarding the way in which an individual appraises physical appearance, including body posture, physique, attractiveness, neatness, fitness and exercise?",
    o:["Life values","Physical values","Self-values","Security values","If not one of these, mark here"], c:1,
    why:"Physical values are about appraising physical appearance. Life values are about biological needs such as nutrition, shelter and health.",
    src:"QC 2 slide 42" },
  { ref:"X-04", q:"Which pair is matched WRONGLY?",
    o:["Plato and the Academy","Aristotle and the Lyceum","Al-Karaouine and Fez","Lovedale and the Moravian Mission","If all pairs are correct, mark here"], c:3,
    why:"Lovedale belongs to the Glasgow Mission. The Moravians were the first mission society at the Cape, so the name sounds right but the pair is wrong.",
    src:"Textbook Ch 2, §3.4, §4.2.2.2" },
  { ref:"U4-18", q:"President Burgers’ Education Ordinance (1874, Transvaal) was based on:",
    o:["the Cape Act of 1865","the 1857 Netherlands law","the British Balfour Act","the CNE principles","If not one of these, mark here"], c:1,
    why:"The 1857 Netherlands law, with a Bible-centred curriculum. CNE schools came later, after the South African War.",
    src:"Textbook §4.7.1" },
  { ref:"U2-09", q:"The Didascaleum provided physical education, with the Pentathlon as its curriculum.",
    o:["True","False"], c:1, tf:true,
    why:"False. That is the Palestra. The Didascaleum was the culture school, with the Seven Liberal Arts as its curriculum.",
    src:"Textbook Ch 2: Ancient Greece (Athens)" },
  { ref:"U3-04", q:"Why should South African students study the history of education in Africa? Choose the MOST correct answer.",
    o:["Because SA and Africa share a common history and challenges.","Because of a shared history and challenges, because Africa saw the biggest education expansion in human history since 1960, and because of Africa’s rising global significance.","Because of Africa’s rising global significance.","Because Africa had the earliest schools."], c:1,
    why:"A and C are true but each is only one reason. B carries all three. The earliest schools were in Egypt and Mesopotamia, but that is not a reason the book gives.",
    src:"Textbook §3.1" },
  { ref:"U1-16", q:"Education support services are directed at three targets. They are:",
    o:["learners, educators and the teaching-learning activities","parents, communities and policy","learners, parents and the state","educators, the minister and school governing bodies","If not one of these, mark here"], c:0,
    why:"Learners, educators and the teaching-learning activities. Support services are an internal component of the education system.",
    src:"Textbook Ch 1: the education system" },
  { ref:"U4-57", q:"Thirty years into democracy, which judgement is best supported by the textbook?",
    o:["The post-1994 reforms changed nothing.","Access widened greatly (higher education up 48.6%, black enrolments up 111.9%), but inequality persists (90 to 100% matric passes in historically white schools against about 33% in some former-Transkei schools), so quality, equity and relevance remain the salient issues.","Every school now offers equal quality.","Decolonisation was completed in 2015."], c:1,
    why:"The book shows both sides: access grew a lot, but inequality is still there. The other lines are absolutes that the figures disprove.",
    src:"Textbook §4.10, §4.11" },
  { ref:"E2-Q4", q:"According to Plato, the origin of knowledge is:",
    o:["in books","in the outside world, through the senses","unknown","inside the human mind"], c:3,
    why:"Plato looked for the origin of knowledge inside the human mind. Looking to the outside world through the senses is Aristotle, which is how he differed from Plato.",
    src:"Textbook Ch 2, p. 29. From the real eFundi Test 2." },
  { ref:"U3-39", q:"Which of these are Bhola’s approaches to eradicating adult illiteracy?",
    list:["The project approach","The programme approach","The campaign approach","The curriculum approach"],

{ id:"t5", num:5, title:"Test 5", ready:false, desc:"Coming soon.", qs:[] }

/* =====================================================================
   ENGINE. No need to touch this when adding a test.
   ===================================================================== */
const LETTERS = ["A","B","C","D","E","F"];
const SCORE_KEY = "edcc125-scores-v1", PROG_KEY = "edcc125-progress-v1";
const app = document.getElementById("app");
let cur = null;      // { test, order:[[optIdx...]...], picks:[slot|-1...] }
let wrongOnly = false;

function load(key){ try { return JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch(e){ return {}; } }
function save(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function shuffle(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
function toTop(){ window.scrollTo(0,0); }

function home(){
  cur = null; wrongOnly = false;
  const scores = load(SCORE_KEY), prog = load(PROG_KEY);
  let h = '<header><div class="eyebrow">EDCC125 · Exam practice</div><h1>Practice tests</h1>' +
    '<p class="meta">Open book · 50 questions · 1 mark each · units 1 to 4. Scores stay on this device only.</p></header>' +
    '<details class="tips"><summary>Four habits that save marks</summary><ul>' +
    '<li><b>NOT / wrong / incorrect in the stem?</b> Write T or F next to every line. The F is the answer. No F at all: take the “mark here” option.</li>' +
    '<li><b>“If not one of these, mark here”</b> is sometimes the real answer and sometimes bait. Judge A to D first; then it answers itself.</li>' +
    '<li><b>Combo options (“A and C”):</b> tick the true statements, count them, and take the combo with that count. The option letters are shuffled.</li>' +
    '<li><b>“MOST correct”:</b> several options are true; the fullest, most complete one wins. And check every name and number in a familiar line: one swapped word makes it false.</li>' +
    '</ul></details><div class="tests">';
  TESTS.forEach(function(t){
    const s = scores[t.id], inProg = prog[t.id];
    let best = 'Not attempted yet';
    if (s) best = 'Best: <b>' + s.best + '/' + t.qs.length + '</b> · last ' + s.last + '/' + t.qs.length;
    if (!t.ready) {
      h += '<div class="tcard soon"><h2>' + esc(t.title) + '</h2><p class="desc">Coming soon.</p>' +
           '<div class="row"><span class="best"></span><button class="go" disabled>Coming soon</button></div></div>';
      return;
    }
    h += '<div class="tcard"><h2>' + esc(t.title) + '</h2><p class="desc">' + esc(t.desc) + ' ' + t.qs.length + ' questions.</p>' +
         '<div class="row"><span class="best">' + best + '</span><div class="btns">' +
         (inProg ? '<button class="ghost" data-fresh="' + t.id + '">Start over</button><button class="go" data-start="' + t.id + '">Resume</button>'
                 : '<button class="go" data-start="' + t.id + '">Start</button>') +
         '</div></div></div>';
  });
  h += '</div><p class="note">Every question shows the answer, why, and where it is in the textbook after you submit. Built from the EDCC125 textbook (units 1 to 4), the QC slides and the four eFundi chapter tests.</p>';
  app.innerHTML = h;
  app.querySelectorAll("[data-start]").forEach(function(b){ b.onclick = function(){ start(b.dataset.start, false); }; });
  app.querySelectorAll("[data-fresh]").forEach(function(b){ b.onclick = function(){ start(b.dataset.fresh, true); }; });
  toTop();
}

function start(id, fresh){
  const test = TESTS.find(function(t){ return t.id === id; });
  const prog = load(PROG_KEY);
  const saved = prog[id];
  if (!fresh && saved && saved.order && saved.order.length === test.qs.length) {
    cur = { test:test, order:saved.order, picks:saved.picks };
  } else {
    const order = test.qs.map(function(q){
      const base = q.o.map(function(_,i){ return i; });
      return q.tf ? base : shuffle(base);   // true/false keeps its order; everything else shuffles
    });
    cur = { test:test, order:order, picks:test.qs.map(function(){ return -1; }) };
    saveProgress();
  }
  renderTest();
}

function saveProgress(){
  const prog = load(PROG_KEY);
  prog[cur.test.id] = { order:cur.order, picks:cur.picks };
  save(PROG_KEY, prog);
}
function clearProgress(id){ const prog = load(PROG_KEY); delete prog[id]; save(PROG_KEY, prog); }

function stemHtml(q, i){
  let h = '<div class="qhead"><span class="qnum">' + (i+1) + '.</span><span class="qtext">' + esc(q.q) + '</span></div>';
  if (q.list) {
    h += '<ul class="qlist">' + q.list.map(function(s,k){ return '<li><b>' + LETTERS[k] + ')</b>' + esc(s) + '</li>'; }).join('') + '</ul>';
  }
  return h;
}

function renderTest(){
  const t = cur.test;
  let h = '<div class="topbar"><span class="tname">' + esc(t.title) + '</span>' +
          '<span class="chip" id="count"></span><button class="exit" id="exit">Back to tests</button></div>';
  t.qs.forEach(function(q, i){
    h += '<div class="q">' + stemHtml(q, i) + '<div class="opts">';
    cur.order[i].forEach(function(oi, slot){
      const sel = cur.picks[i] === slot;
      h += '<label class="opt' + (sel ? ' sel' : '') + '"><input type="radio" name="q' + i + '" value="' + slot + '"' + (sel ? ' checked' : '') + '>' +
           '<span class="letter">' + LETTERS[slot] + ')</span><span>' + esc(q.o[oi]) + '</span></label>';
    });
    h += '</div></div>';
  });
  h += '<div class="submitrow" id="submitrow"><button class="go" id="submit">Mark my test</button></div>';
  app.innerHTML = h;
  app.querySelectorAll('input[type=radio]').forEach(function(inp){
    inp.onchange = function(){
      const i = +inp.name.slice(1);
      cur.picks[i] = +inp.value;
      inp.closest('.opts').querySelectorAll('.opt').forEach(function(l){ l.classList.remove('sel'); });
      inp.closest('.opt').classList.add('sel');
      saveProgress(); updateCount();
    };
  });
  document.getElementById('exit').onclick = home;
  document.getElementById('submit').onclick = trySubmit;
  updateCount(); toTop();
}

function updateCount(){
  const n = cur.picks.filter(function(p){ return p >= 0; }).length;
  document.getElementById('count').textContent = n + '/' + cur.test.qs.length + ' answered';
}

function trySubmit(){
  const blanks = [];
  cur.picks.forEach(function(p,i){ if (p < 0) blanks.push(i+1); });
  if (!blanks.length) return mark();
  const row = document.getElementById('submitrow');
  row.innerHTML = '<div class="warn">You left ' + blanks.length + ' blank: Q' + blanks.slice(0,12).join(', Q') + (blanks.length > 12 ? ' and more' : '') +
    '. Blanks count as wrong.</div><div class="btns"><button class="ghost" id="keep">Keep going</button><button class="go" id="anyway">Mark it anyway</button></div>';
  document.getElementById('keep').onclick = function(){ row.innerHTML = '<button class="go" id="submit">Mark my test</button>'; document.getElementById('submit').onclick = trySubmit; };
  document.getElementById('anyway').onclick = mark;
}

function mark(){
  const t = cur.test;
  let score = 0;
  cur.result = t.qs.map(function(q, i){
    const rightSlot = cur.order[i].indexOf(q.c);
    const ok = cur.picks[i] === rightSlot;
    if (ok) score++;
    return { ok:ok, rightSlot:rightSlot };
  });
  cur.score = score;
  const scores = load(SCORE_KEY);
  const prev = scores[t.id];
  scores[t.id] = { best: prev ? Math.max(prev.best, score) : score, last: score, when: new Date().toISOString().slice(0,10) };
  save(SCORE_KEY, scores);
  clearProgress(t.id);
  renderReview();
}

function renderReview(){
  const t = cur.test, total = t.qs.length, score = cur.score;
  const pct = Math.round(score * 100 / total);
  let h = '<div class="topbar"><span class="tname">' + esc(t.title) + ': marked</span><button class="exit" id="exit">Back to tests</button></div>' +
    '<div class="result"><div class="score">' + score + '/' + total + '</div><div class="sub"><b>' + pct + '%</b>. ' +
    (total - score) + ' to look at. Each question below shows the right answer (green), your pick if it was wrong (red), why, and where to find it.</div>' +
    '<div class="btns"><button class="ghost" id="filter">' + (wrongOnly ? 'Show all questions' : 'Show only my mistakes') + '</button>' +
    '<button class="go" id="again">Try again (new option order)</button></div></div><div class="review">';
  t.qs.forEach(function(q, i){
    const r = cur.result[i], pick = cur.picks[i];
    if (wrongOnly && r.ok) return;
    h += '<div class="q">' + stemHtml(q, i) + '<div class="opts">';
    cur.order[i].forEach(function(oi, slot){
      let cls = 'opt', tag = '';
      if (slot === r.rightSlot) { cls += ' right'; tag = '<span class="tag ok">' + (slot === pick ? 'your answer ✓' : 'correct') + '</span>'; }
      else if (slot === pick) { cls += ' wrongpick'; tag = '<span class="tag no">your answer</span>'; }
      h += '<div class="' + cls + '"><span class="letter">' + LETTERS[slot] + ')</span><span>' + esc(q.o[oi]) + '</span>' + tag + '</div>';
    });
    h += '</div><div class="fb ' + (r.ok ? 'ok' : 'no') + '"><span class="verdict">' +
         (r.ok ? 'Right.' : (pick < 0 ? 'Left blank. Answer: ' : 'Not this time. Answer: ') + LETTERS[r.rightSlot] + ')') +
         '</span>' + esc(q.why) + '<span class="src">Source: ' + esc(q.src) + '</span></div></div>';
  });
  if (wrongOnly && score === total) h += '<p class="note">No mistakes to show. Full marks.</p>';
  h += '</div><div class="submitrow"><button class="ghost" id="back2">Back to tests</button></div>';
  app.innerHTML = h;
  document.getElementById('exit').onclick = home;
  document.getElementById('back2').onclick = home;
  document.getElementById('again').onclick = function(){ start(t.id, true); };
  document.getElementById('filter').onclick = function(){ wrongOnly = !wrongOnly; renderReview(); };
  toTop();
}

home();
</script>
