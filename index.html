<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDCC125 Practice Tests</title>
<meta name="description" content="Five open-book practice tests for the EDCC125 exam, units 1 to 4.">
<style>
  :root {
    --amber:#b45309; --amber-dark:#92400e; --gold:#d97706; --amber-soft:#fef3e2;
    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --ground:#faf7f2; --card:#ffffff;
    --good:#15803d; --good-soft:#f0fdf4; --good-line:#bbf7d0;
    --bad:#b91c1c; --bad-soft:#fef2f2; --bad-line:#fecaca;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --amber:#f59e0b; --amber-dark:#fbbf24; --gold:#fbbf24; --amber-soft:#2a2116;
      --ink:#f3f4f6; --muted:#a1a1aa; --line:#3f3f46; --ground:#18181b; --card:#232326;
      --good:#4ade80; --good-soft:#132a1b; --good-line:#1f5132;
      --bad:#f87171; --bad-soft:#2d1515; --bad-line:#5c2323;
      color-scheme: dark;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
         color:var(--ink); background:var(--ground); line-height:1.55; font-size:15px;
         overflow-wrap:anywhere; }
  .wrap { max-width:820px; margin:0 auto; padding:24px 16px 64px; }
  header { border-bottom:3px solid var(--amber); padding-bottom:14px; margin-bottom:18px; }
  .eyebrow { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--amber); font-weight:700; }
  h1 { font-size:25px; margin:4px 0 4px; line-height:1.25; }
  .meta { color:var(--muted); font-size:13.5px; margin:0; }

  .tips { background:var(--amber-soft); border-radius:12px; padding:12px 16px; margin:0 0 18px; font-size:14px; }
  .tips summary { cursor:pointer; font-weight:700; color:var(--amber); }
  .tips ul { margin:8px 0 2px; padding-left:20px; }
  .tips li { margin:4px 0; }

  .tests { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px) { .tests { grid-template-columns:1fr; } }
  .tcard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px;
           display:flex; flex-direction:column; gap:6px; }
  .tcard.soon { opacity:.6; }
  .tcard h2 { margin:0; font-size:17px; }
  .tcard .desc { font-size:13.5px; color:var(--muted); flex:1; margin:0; }
  .tcard .row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; flex-wrap:wrap; }
  .best { font-size:13px; color:var(--muted); }
  .best b { color:var(--good); }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .go { background:var(--amber); color:#fff; border:0; border-radius:10px; padding:9px 18px;
        font-weight:600; font-size:14px; cursor:pointer; font-family:inherit; }
  .go:hover { background:var(--amber-dark); }
  .go:disabled { background:var(--line); color:var(--muted); cursor:default; }
  .ghost { background:var(--card); border:1px solid var(--amber); color:var(--amber); border-radius:10px;
           padding:8px 14px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:inherit; }

  .topbar { position:sticky; top:0; z-index:5; background:var(--ground); border-bottom:2px solid var(--amber);
            padding:10px 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .topbar .tname { font-weight:700; font-size:15px; flex:1; min-width:120px; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 12px;
          font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
  .exit { background:none; border:1px solid var(--line); color:var(--muted); border-radius:10px;
          padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit; }

  .q { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:14px 0; }
  .qhead { display:flex; gap:10px; align-items:baseline; }
  .qnum { flex:0 0 auto; font-weight:700; color:var(--amber); font-variant-numeric:tabular-nums; }
  .qtext { font-weight:600; font-size:15px; }
  .qlist { margin:8px 0 0; padding:0; list-style:none; font-size:14.5px; }
  .qlist li { margin:3px 0; padding-left:26px; text-indent:-26px; }
  .qlist b { display:inline-block; width:26px; text-indent:0; color:var(--muted); }
  .opts { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .opt { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:10px;
         padding:9px 12px; cursor:pointer; font-size:14.5px; background:var(--card); }
  .opt:hover { border-color:var(--gold); }
  .opt input { margin-top:4px; accent-color:var(--amber); flex:0 0 auto; }
  .opt .letter { font-weight:700; color:var(--muted); flex:0 0 auto; }
  .opt.sel { border-color:var(--amber); background:var(--amber-soft); }
  .review .opt { cursor:default; }
  .opt.right { border-color:var(--good); background:var(--good-soft); }
  .opt.right .letter { color:var(--good); }
  .opt.wrongpick { border-color:var(--bad); background:var(--bad-soft); }
  .opt.wrongpick .letter { color:var(--bad); }
  .tag { font-size:12px; font-weight:700; margin-left:auto; padding-left:8px; flex:0 0 auto; }
  .tag.ok { color:var(--good); } .tag.no { color:var(--bad); }
  .fb { margin-top:10px; border-radius:10px; padding:10px 13px; font-size:14px; }
  .fb.ok { background:var(--good-soft); border:1px solid var(--good-line); }
  .fb.no { background:var(--bad-soft); border:1px solid var(--bad-line); }
  .fb .verdict { font-weight:700; display:block; margin-bottom:2px; }
  .fb.ok .verdict { color:var(--good); } .fb.no .verdict { color:var(--bad); }
  .fb .src { display:block; margin-top:6px; font-size:13px; color:var(--muted); }

  .submitrow { display:flex; flex-direction:column; align-items:center; gap:10px; margin:24px 0; text-align:center; }
  .warn { background:var(--bad-soft); border:1px solid var(--bad-line); border-radius:10px; padding:10px 14px; font-size:14px; }
  .result { background:var(--amber-soft); border-radius:12px; padding:16px; margin:16px 0;
            display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .score { font-size:32px; font-weight:800; color:var(--amber); font-variant-numeric:tabular-nums; line-height:1.1; }
  .result .sub { font-size:14px; flex:1; min-width:170px; }
  .note { font-size:13px; color:var(--muted); margin-top:22px; }
  button:focus-visible, .opt:focus-within { outline:2px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";
/* =====================================================================
   TEST DATA. Later tests are appended here; see README.md for the format.
   c = index of the correct option in o (before shuffling).
   tf:true = keep the options in the given order (true/false questions).
   list = optional lettered statements shown under the stem (combo questions).
   ===================================================================== */
const TESTS = [
{ id:"t1", num:1, title:"Test 1", ready:true,
  desc:"Mixed units 1 to 4. Includes the real Socrates exam question.",
  qs:[
  { ref:"U1-15", q:"Which internal component of the education system is called its “heart”, where teacher and learners meet?",
    o:["Education system policy","Education system administration","Structures for teaching","Education support services","If not one of these, mark here"], c:2,
    why:"Structures for teaching (levels, institutions, curricula, educators, learners) is the heart: that is where teacher and learners meet. Administration manages, policy directs, and support services help from outside the classroom.",
    src:"Textbook Ch 1: internal components of the education system" },
  { ref:"U3-18", q:"At the end of the colonial era (1960) the adult literacy rate in Africa was about:",
    o:["9%","22%","34%","50%","If not one of these, mark here"], c:0,
    why:"About 9%. Colonial schooling reached very few people.",
    src:"Textbook §3.6" },
  { ref:"U2-01", q:"Socrates used the metaphor of a midwife to explain his role as an educator.",
    o:["True","False"], c:0, tf:true,
    why:"True, word for word from Chapter 2: “Socrates used the metaphor of a mid-wife to explain his role as educator.” He helped the young men bring out the answers already inside their own minds. (This one is a real exam question.)",
    src:"Textbook Ch 2: Socrates" },
  { ref:"U4-21", q:"The Union of South Africa came into being on:",
    o:["31 May 1910","31 May 1961","16 June 1976","8 August 1881","If not one of these, mark here"], c:0,
    why:"31 May 1910. 31 May 1961 is the republic, and 16 June 1976 is the Soweto uprising.",
    src:"Textbook §4.8" },
  { ref:"E1-Q12", q:"Which type of value relates to an individual’s beliefs regarding the relationships with other people, and includes friendship, co-operation, respect, equality, love for others, care, loyalty, mutual trust and to be of service?",
    o:["Moral values","Social values","Affective/emotional values","Self-values","If not one of these, mark here"], c:1,
    why:"Relationships with other people = social values. Moral values are about right and wrong; affective/emotional values are about guiding your own emotions and feelings; self-values are about how you relate to yourself.",
    src:"QC 2 slides 36 to 37 (Ch 1: types of values). From the real eFundi Test 1." },
  { ref:"U3-12", q:"Which was NOT a centre of Islamic learning in Africa named in the textbook?",
    o:["Timbuktu","Harar","Zeila","Genadendal","If all of these were Islamic centres, mark here"], c:3,
    why:"Genadendal is the Moravian mission station in South Africa (Chapter 4). Timbuktu, Harar and Zeila are the Islamic centres.",
    src:"Textbook §3.4" },
  { ref:"E2-Q5", q:"Humanism forms part of which era?",
    o:["Renaissance","Middle Ages","Early modern period","Industrial Revolution","Mesolithic era"], c:0,
    why:"Part of the Renaissance movement was a new philosophy, a new way of looking at the world and at life: Humanism.",
    src:"Textbook Ch 2, p. 39. From the real eFundi Test 2." },
  { ref:"U4-30", q:"Which is NOT one of the intrinsic goals (principles) of the post-1994 education policy?",
    o:["Democratisation","Desegregation","Decentralisation","Nation building","If all of these are intrinsic goals, mark here"], c:3,
    why:"Nation building is a societal (extrinsic) goal. The five intrinsic goals are democratisation, desegregation, decentralisation, equal educational opportunities and multicultural education.",
    src:"Textbook §4.10, p. 110" },
  { ref:"U1-21", q:"“Ideas and guidelines regarding the way in which an individual relates to him/herself as a person: independence, self-respect, self-discipline, patience.” These are:",
    o:["Affective / emotional values","Self-values","Moral values","Social values","If not one of these, mark here"], c:1,
    why:"“Relates to him/herself as a person” = self-values. The favourite swap is affective/emotional values, which are about guiding emotions and feelings.",
    src:"QC 2 slide 42 (Ch 1: types of values)" },
  { ref:"E3-Q1", q:"According to a 1997 study in Mali, enrolments in Islamic schools equalled about what percentage of public-school enrolments?",
    o:["10%","15%","25%","50%"], c:2,
    why:"Tsehaye (2014), relying on a 1997 study in Mali, reported that enrolments in these schools equal 25% of the enrolments in public schools.",
    src:"Textbook §3.4, p. 68. From the real eFundi Test 3." },
  { ref:"U2-13", q:"Aristotle’s school and his view of knowledge were:",
    o:["the Academy; rationalism","the Lyceum; empiricism","the Lyceum; rationalism","the Academy; empiricism","If not one of these, mark here"], c:1,
    why:"Aristotle: the Lyceum, and knowledge comes through the senses (empiricism). Plato: the Academy and rationalism.",
    src:"Textbook Ch 2: Plato and Aristotle" },
  { ref:"E4-Q2", q:"During the period of the Boer republics, education for ______ students was exclusively the task of the mission stations, without government assistance.",
    o:["non-white","white","Dutch-speaking","English-speaking","If not one of these, mark here"], c:0,
    why:"During the period of the Boer republics, education for non-white students was exclusively the task of the mission stations without government assistance.",
    src:"Textbook Ch 4, p. 90. From the real eFundi Test 4 (re-optioned)." },
  { ref:"U1-14", q:"Which is NOT a part-discipline of Education (the science)?",
    o:["Sociology of Education","Curriculum Studies","Comparative Education","Educational Psychology","If all of these are part-disciplines, mark here"], c:4,
    why:"All four are part-disciplines of Education, so the mark-here option is the answer. Habit: write T or F next to every line. No F means mark here.",
    src:"Textbook Ch 1: part-disciplines of Education" },
  { ref:"U3-08", q:"The Ancient Egyptians had a university around 3000 BC with a library of about 700 scrolls.",
    o:["True","False"], c:1, tf:true,
    why:"False. The University of Alexandria dates from the Greek (Hellenistic) era, after the 4th century BC, and its library held more than 700 000 scrolls. Two tokens are wrong.",
    src:"Textbook §3.3" },
  { ref:"U2-23", q:"What did the Islam Empire give Europe? Choose the MOST correct answer.",
    o:["Paper","Hindu-Arabic numerals","Hindu-Arabic numerals and paper, and it rekindled interest in Greek-Roman knowledge","The printing press"], c:2,
    why:"Paper and the numerals are both true but incomplete: the fullest answer wins. The printing press was Gutenberg’s (1453).",
    src:"Textbook Ch 2: Islamic education" },
  { ref:"U4-23", q:"The biggest grievance behind the Soweto uprising of 16 June 1976 was:",
    o:["school fees","language (50/50 English and Afrikaans)","school buildings","the matric exam","If not one of these, mark here"], c:1,
    why:"Various reasons gave momentum to the uproar in Soweto, of which language was the biggest.",
    src:"Textbook §4.8.1, p. 103" },
  { ref:"E1-Q25", q:"A country’s size, shape, location, topography, climate and biodiversity belong to which external determinant of the education system?",
    o:["Demographical tendencies","Geographical characteristics","Social systems","Science and technology tendencies","If not one of these, mark here"], c:1,
    why:"Geography is about the land. Demography is about the people (population size, growth, age, urbanisation).",
    src:"Textbook Ch 1: external determinants. From the real eFundi Test 1." },
  { ref:"E3-Q3", q:"The Greek ruler, Aristotle the Great, who ruled during the 4th century BC, built up a large empire by means of his conquests.",
    o:["True","False"], c:1, tf:true,
    why:"False. It was Alexander the Great. Aristotle was the philosopher of the Lyceum. One name swapped.",
    src:"Textbook Ch 3, p. 67. From the real eFundi Test 3." },
  { ref:"U2-10", q:"Which is NOT one of the Seven Liberal Arts?",
    o:["Grammar","Rhetoric","Astronomy","Music","If all of these are liberal arts, mark here"], c:4,
    why:"All four are liberal arts. The seven: Grammar, Dialectics, Rhetoric, Arithmetic, Geometry, Astronomy, Music.",
    src:"Textbook Ch 2: Athens, the Didascaleum" },
  { ref:"U4-41", q:"School governing bodies include representatives of the following. Which is wrong?",
    o:["Parents","Teachers","Non-teaching staff","The provincial MEC","If all of these are on the SGB, mark here"], c:3,
    why:"An SGB has parents, teachers, non-teaching staff, the principal, students and co-opted members. The MEC is not on it.",
    src:"QC 8 slide 9 (Ch 4: post-1994 education)" },
  { ref:"U1-38", q:"A teacher tells learners never to question the textbook’s political views and marks down any learner who does. Which activity-concept fits best?",
    o:["Coaching","Indoctrination","Forming","Teaching","If not one of these, mark here"], c:1,
    why:"Biased imprinting where questioning is not allowed = indoctrination. Forming is environmental influence where the learner has no real choice; teaching is open, planned activity.",
    src:"Textbook Ch 1: activity-concepts" },
  { ref:"U3-27", q:"Julius Nyerere’s “Education for Self-Reliance” (1967) was from:",
    o:["Kenya","Tanzania","Zimbabwe","Botswana","If not one of these, mark here"], c:1,
    why:"Tanzania. The model has since been completely abandoned.",
    src:"Textbook §3.9.1" },
  { ref:"X-02", q:"1948 is the year of the UN Universal Declaration of Human Rights, and also the year the National Party came to power in South Africa.",
    o:["True","False"], c:0, tf:true,
    why:"True. Both happened in 1948 (Chapter 2 and Chapter 4). Check each half: both hold.",
    src:"Textbook Ch 2 and §4.9" },
  { ref:"E2-Q2", q:"Epistemology is:",
    o:["the theory of knowledge","the theory of the senses","the theory of education","the theory of observation"], c:0,
    why:"“With his epistemology (theory of knowledge), Aristotle laid the basis for an entire line of sciences.” Observation is how Aristotle said we get knowledge, not what the word means.",
    src:"Textbook Ch 2, pp. 29 to 30. From the real eFundi Test 2." },
  { ref:"U4-13", q:"Why did the Voortrekkers leave the Cape? Choose the MOST correct answer.",
    o:["The Anglicisation policy.","The Anglicisation policy, plus the abolition of slavery, rising land costs and class-over-race issues.","Rising land costs.","The abolition of slavery."], c:1,
    why:"The book names the Anglicisation policy; the QC slides add the other reasons. Each short option is true but incomplete, so the fullest answer wins.",
    src:"Textbook §4.4 and QC 7" },
  { ref:"E1-Q21", q:"Which concept determines the concept “education”?",
    o:["Gender","All roles in life","A particular role in life","Age","If not one of these, mark here"], c:1,
    why:"Education prepares learners to fulfil their roles in life: all six of them. One particular role is training.",
    src:"Textbook Ch 1, p. 2: education and the roles in life. From the real eFundi Test 1." },
  { ref:"U3-17", q:"Colonial schools trained people for auxiliary positions such as clerks, interpreters, policemen, soldiers and:",
    o:["doctors","engineers","lawyers","teachers at universities","If not one of these, mark here"], c:4,
    why:"The missing one is preachers, which is not listed, so mark here. Colonial schools gave only enough education for auxiliary and subsidiary posts.",
    src:"Textbook §3.6" },
  { ref:"E2-Q17", q:"The school of the Litterator was attended by children aged:",
    o:["9 to 13 years","8 to 11 years","10 to 14 years","7 to 10 years","6 to 9 years"], c:3,
    why:"The elementary school (the school of the Litterator) was attended by children aged 7 to 10, learning to read, write and do elementary arithmetic.",
    src:"Textbook Ch 2, pp. 31 to 32. From the real eFundi Test 2." },
  { ref:"U4-27", q:"White government schools only opened to learners of all races after the 1994 elections.",
    o:["True","False"], c:1, tf:true,
    why:"False. They opened in 1991, announced in de Klerk’s speech of 2 February 1990.",
    src:"Textbook §4.10" },
  { ref:"U1-36", q:"Which of the following are INTERNAL components of the education system?",
    list:["Education system policy","Demographical tendencies","Education support services","Education system administration"],
    o:["A and B","A, C and D","B and D","All of these","None of these"], c:1,
    why:"Policy, support services and administration are internal (with structures for teaching). Demographical tendencies are external. Tick the true lines, count them (three), and take the combo with three. The option letters on screen are shuffled, so ignore them.",
    src:"Textbook Ch 1: internal components of the education system" },
  { ref:"E3-Q5", q:"Why did most African governments choose to expand the inherited education system after independence in 1960?",
    o:["They wanted to eliminate all European influences immediately.","There was pressure to increase access to education and few tested alternative models were available.","The inherited education systems were perfectly suited to African needs.","They were required by international organisations to keep the same system.","They wanted to reduce the number of students attending school."], c:1,
    why:"Pressure to expand access, together with the absence of tested alternative models, dictated their choice: a linear expansion, more of the same.",
    src:"Textbook §3.9.1, p. 72. From the real eFundi Test 3." },
  { ref:"U2-20", q:"The University of Bologna (1158) was known for:",
    o:["Theology","Law","Medicine","Philosophy","If not one of these, mark here"], c:1,
    why:"Bologna = Law. Paris = Theology, Salerno = Medicine.",
    src:"Textbook Ch 2: medieval universities" },
  { ref:"E4-Q20", q:"Which of the following was NOT a characteristic of Indian education in Natal before 1910?",
    o:["The unwillingness of parents to allow their daughters to attend school made progress of the schools difficult.","A shortage of teachers made progress of the schools difficult.","Education was through the medium of English.","If all are characteristics, mark here"], c:3,
    why:"All three lines are in the book, almost word for word. No F, so mark here.",
    src:"Textbook §4.6.1, p. 99. From the real eFundi Test 4." },
  { ref:"U1-18", q:"Which is NOT one of the external determinants of the education system?",
    o:["Geographical characteristics","Demographical tendencies","Education support services","Worldview and religion","If all of these are external determinants, mark here"], c:2,
    why:"Education support services is an internal component. The others are external determinants.",
    src:"Textbook Ch 1: external determinants" },
  { ref:"X-08", q:"In the last class of the semester, the lecturer said the best teacher is the one who:",
    o:["experienced it, and did not just read about it","has the thickest textbook","sings the best goodbye song"], c:0,
    why:"A free mark, to breathe. (Said in class on 17 Oct, not in the book.)",
    src:"Last class, 17 Oct" },
  { ref:"U3-33", q:"Which was NOT part of the IMF and World Bank structural adjustment package?",
    o:["Reduce government expenditure","Privatise State corporations","Devalue the currency","Increase government spending on education","If all of these were part of it, mark here"], c:3,
    why:"Education spending actually fell, from US$10 billion to US$8.9 billion (1980 to 1983).",
    src:"Textbook §3.10" },
  { ref:"E2-Q14", q:"During the Renaissance era (mark the incorrect statement):",
    o:["The lecture method of teaching was supplemented with the textbook method.","The content of education also included the Classic subjects.","The privilege of education was expanded to include everyone.","The aim was expanded to also include some preparation for this life and world.","If all are correct, mark here"], c:2,
    why:"The privilege of education was expanded to include the sons of the aristocracy, not everyone. The other three lines are in the book.",
    src:"Textbook Ch 2, pp. 40 to 41. From the real eFundi Test 2." },
  { ref:"U4-47", q:"OBE’s eight critical outcomes were designed by:",
    o:["the HSRC","SAQA","the National Party","UNESCO","If not one of these, mark here"], c:1,
    why:"SAQA designed the critical outcomes.",
    src:"Textbook §4.10" },
  { ref:"E1-Q15", q:"“Cornerstone values are consistent, universal and transcultural.” This describes which property of values?",
    o:["Values are personal","Values have a universal character","Values are influenced by culture","Values are subjective","If not one of these, mark here"], c:1,
    why:"Consistent, universal, transcultural cornerstone values = values have a universal character.",
    src:"QC 1 slide 30 (Ch 1: properties of values). From the real eFundi Test 1." },
  { ref:"U3-09", q:"At Alexandria, the first person to calculate the size of the earth was:",
    o:["Euclid","Archimedes","Eratosthenes","Aristarchus","If not one of these, mark here"], c:2,
    why:"Eratosthenes. Euclid = geometry, Archimedes = physics, Aristarchus = the parts of speech.",
    src:"Textbook §3.3" },
  { ref:"U2-33", q:"Herbart held the first Chair of Education (Göttingen) and is the father of:",
    o:["the work school, student-centred","the listen school, teacher-centred","the palace school","the kindergarten","If not one of these, mark here"], c:1,
    why:"Herbart’s listen school is still the dominant model worldwide. Dewey’s work school was student-centred and a passing fad.",
    src:"Textbook Ch 2: Herbart" },
  { ref:"E4-Q7", q:"In 1983, the then Minister of Internal Affairs delegated all powers for Indian education (under the Indian Education Act of 1965) to:",
    o:["the South African Indian Council","the Natal Provincial Council","the HSRC","SAQA","If not one of these, mark here"], c:0,
    why:"In 1983 the Minister of Internal Affairs, F.W. de Klerk, delegated all powers attributed to him by the Indian Education Act of 1965 to the South African Indian Council.",
    src:"Textbook §4.8.3.2, p. 106. From the real eFundi Test 4 (re-optioned)." },
  { ref:"U1-23", q:"Physical values are beliefs about the biological and physiological (natural) needs of all people: survival, nutrition, clothing, shelter and health.",
    o:["True","False"], c:1, tf:true,
    why:"False. That is the definition of LIFE values. Physical values are about appraising physical appearance (posture, fitness, neatness).",
    src:"Textbook Ch 1: types of values" },
  { ref:"E3-Q2", q:"Ancient Egyptian society comprised a number of social classes. Which of these was NOT one of them?",
    o:["Rulers (the Pharaohs)","Priests","Judges","Slaves","If all of these were social classes, mark here"], c:2,
    why:"The book lists rulers, priests, nobles, soldiers, artisans, merchants, farmers and, at the bottom, slaves. No judges.",
    src:"Textbook Ch 3, p. 66. From the real eFundi Test 3 (re-optioned)." },
  { ref:"X-06", q:"Which oldest-university claim does the textbook treat as the African counter-claim?",
    o:["Paris (about 1080)","Alexandria (4th century BC)","Al-Karaouine, Fez (859)","Bologna (1158)","If not one of these, mark here"], c:2,
    why:"Al-Karaouine in Fez, Morocco, founded in 859, is the African counter-claim to the oldest university in the world.",
    src:"Textbook Ch 2 and §3.4" },
  { ref:"U4-02", q:"The first school at the Cape (1658) was for:",
    o:["white children","slaves from Angola","Khoikhoi children","Indian children","If not one of these, mark here"], c:1,
    why:"Slaves from Angola. They were taught Dutch and converted to Christianity.",
    src:"Textbook §4.2.1" },
  { ref:"U2-02", q:"Plato used the metaphor of a midwife to explain his role as an educator.",
    o:["True","False"], c:1, tf:true,
    why:"False. It was Socrates (look back at Question 3). One name swapped in a line you already met: check every name again.",
    src:"Textbook Ch 2: Socrates" },
  { ref:"E1-Q14", q:"Achievement, insight, logic, knowledge, creative thinking and thinking skills are examples of:",
    o:["Occupational values","Intellectual values","Self-values","Economic values","If not one of these, mark here"], c:1,
    why:"These are intellectual values: the mind and knowledge.",
    src:"Textbook Ch 1: types of values. From the real eFundi Test 1." },
  { ref:"ART-u3a-Q23", q:"In 2006, for the first time, ___ into Africa exceeded aid (US$48 billion vs US$40 billion).",
    o:["foreign direct investment (FDI)","China-Africa trade","structural adjustment lending","export earnings","If not one of these, mark here"], c:0,
    why:"Foreign direct investment (US$48 billion) exceeded aid (US$40 billion) for the first time in 2006.",
    src:"Textbook §3.11" },
  { ref:"E2-Q18", q:"The Romans had no formative influence on western civilisation.",
    o:["True","False"], c:1, tf:true,
    why:"False. The book says the Romans had a formative influence on western civilisation. One word, “no”, was inserted.",
    src:"Textbook Ch 2, p. 30. From the real eFundi Test 2." }
  ]},
{ id:"t2", num:2, title:"Test 2", ready:true,
  desc:"Mixed units 1 to 4. Includes the real Africa-reasons exam question.",
  qs:[
  { ref:"U1-39", q:"“The activities whereby an adult (educator) guides a non-adult to adulthood” is the narrow view of education given by:",
    o:["UNESCO (1997)","Steyn & Wolhuter (2014)","Van Rensburg, Kilian & Landman (1979)","Rens & Vreken (2010)","If not one of these, mark here"], c:2,
    why:"Van Rensburg, Kilian & Landman (1979) give the narrow, adult-guides-child view. Steyn & Wolhuter (2014) give the broad definition built on the roles in life.",
    src:"Textbook Ch 1: defining education" },
  { ref:"U3-01", q:"The reasons for studying the history of education in Africa include the following. Which statement is incorrect?",
    o:["Education in Africa and South Africa share a common history, with shared challenges such as high failure rates and drop-outs.","Since 1960 Africa has been the scene of the biggest education-expansion drive in human history.","Africa’s growing demographic weight and political and economic power make it a growing player in the world.","Sub-Saharan Africa was the first region in the world where formal schooling gained a foothold.","If all of these are correct, mark here"], c:3,
    why:"Sub-Saharan Africa was the LAST region in the world where formal schooling gained a foothold, even though the earliest schools (Ancient Egypt) were in Africa. One word, “first”, was swapped. (This one is a real exam question.)",
    src:"Textbook §3.1" },
  { ref:"U2-15", q:"Plato’s The Republic divides society into three classes:",
    o:["priests, scribes and slaves","workers, soldiers and ruler-philosophers","nobles, merchants and farmers","citizens, immigrants and slaves","If not one of these, mark here"], c:1,
    why:"Workers, soldiers and ruler-philosophers, each with its own education. Priests and scribes belong to Ancient Egypt.",
    src:"Textbook Ch 2: Plato" },
  { ref:"U4-09", q:"The first Superintendent-General of Education at the Cape (1839) was:",
    o:["Lord Charles Somerset","Dr James Rose-Innes","Dr Thomas Muir","John Brebner","If not one of these, mark here"], c:1,
    why:"Dr James Rose-Innes, 1839. Somerset proclaimed English the official language (1822), Dr Thomas Muir was superintendent from 1892, and John Brebner was the Free State’s first Inspector-General.",
    src:"Textbook §4.3.1" },
  { ref:"ART-u1b-Q9", q:"Organisational management structures, the financial framework and budget, and communication belong to:",
    o:["education system administration","education system policy","structures for teaching","education support services"], c:0,
    why:"That is education system administration: the education managers, whose work is education control. Policy covers formats and procedures; structures for teaching is the classroom heart.",
    src:"Textbook Ch 1: internal components of the education system" },
  { ref:"U3-26", q:"African countries chose “linear expansion” of the inherited system. This means:",
    o:["more of the same","new African models","cutting back on schools","private schools only","If not one of these, mark here"], c:0,
    why:"Linear expansion = more of the same: the inherited colonial system, just bigger. New models were rare.",
    src:"Textbook §3.9.1" },
  { ref:"E2-Q11", q:"Plato and Aristotle laid the foundation for the two basic epistemological traditions in the West, namely rationalism and empiricism, which influenced education.",
    o:["True","False"], c:0, tf:true,
    why:"True, as the book says it: Plato (rationalism) and Aristotle (empiricism) laid the two foundations.",
    src:"Textbook Ch 2, p. 30. From the real eFundi Test 2." },
  { ref:"U4-31", q:"Which is NOT one of the intrinsic goals (principles) of the post-1994 education policy?",
    o:["Equal educational opportunities","Multicultural education","Democratisation","Decentralisation","If all of these are intrinsic goals, mark here"], c:4,
    why:"All four are intrinsic goals (the fifth is desegregation), so the mark-here option is the answer. Nation building would have been the impostor: it is a societal goal.",
    src:"Textbook §4.10" },
  { ref:"U1-08", q:"Which of the following is NOT one of the learner’s roles in life?",
    o:["Member of a family","Citizen of a country","Vocational person","Utiliser of leisure time","If all of these are roles in life, mark here"], c:4,
    why:"All four are on the list of six roles in life (with self-actualising individual and member of communities in society). No F, so mark here.",
    src:"Textbook Ch 1: education and the roles in life" },
  { ref:"ART-u3a-Q3", q:"Formal schools were established in Egypt very early, between:",
    o:["3000 BC and 2000 BC","4000 BC and 3000 BC","2500 BC and 2000 BC","the 4th century BC and 640 AD","If not one of these, mark here"], c:0,
    why:"3000 BC and 2000 BC. The “4th millennium BC” in the same paragraph is when Egypt already had a remarkable civilisation, not the date of the schools. The 4th century BC is Alexander the Great.",
    src:"Textbook §3.2" },
  { ref:"U2-18", q:"Catechumenal schools:",
    o:["trained clergy in the Bible and Latin","taught new converts the basics of Christianity, ending at baptism","taught the Seven Liberal Arts","were the first universities","If not one of these, mark here"], c:1,
    why:"Catechumenal schools taught new converts the basics, ending at baptism, and were gone by the 9th century AD. Training clergy in the Bible and Latin was the cathedral (bishop’s) school.",
    src:"Textbook Ch 2: early Christian education" },
  { ref:"U4-22", q:"The Bantu Education Act was Act No. 47 of 1963.",
    o:["True","False"], c:1, tf:true,
    why:"False. It was Act No. 47 of 1953. Act No. 47 of 1963 is the Coloured Persons’ Education Act. Same number, different year.",
    src:"Textbook §4.8.1, §4.8.2" },
  { ref:"ART-u1a-Q17", q:"Politics (from the Greek politiká) is defined as:",
    o:["the process of decision-making for groups of people, found in all group interaction","the activities of national government only","the ideology of a ruling political party","the administration of state departments"], c:0,
    why:"Politics is the process of decision-making for groups of people, found in ALL group interaction, not only in government. The other options narrow it.",
    src:"Textbook Ch 1: external determinants (political systems)" },
  { ref:"U3-19", q:"On Independence Day (1966), Botswana had 100 university graduates and 22 secondary-school graduates.",
    o:["True","False"], c:1, tf:true,
    why:"False. The numbers are swapped: 22 university graduates and 100 secondary-school graduates.",
    src:"Textbook §3.6" },
  { ref:"U2-29", q:"What was the educational effect of the Reformation? Choose the MOST correct answer.",
    o:["Teaching in the vernacular","Bible reading","Primary education for all, taught in the vernacular, so that everyone could read the Bible for themselves","Primary education"], c:2,
    why:"Each short option is part of it. The fullest one joins them: primary education for all, in the vernacular, so everyone could read the Bible.",
    src:"Textbook Ch 2: the Reformation" },
  { ref:"E4-Q4", q:"One of the first reports about the state of education in the Cape was issued as a government memorandum in 1839. The stipulations of the memorandum were the following:",
    o:["To reform good citizens and men, instructing them in the relations of social, civil and spiritual life","To reform in the individual advantageous personal habits","To restore the mind with useful knowledge and practical maxims available for the demands of life","If all stipulations are incorrect, mark here","If all stipulations are correct, mark here"], c:3,
    why:"The book says “to FORM” (twice) and “to STORE the mind”. Every line has one word swapped (reform, restore), so all three are incorrect.",
    src:"Textbook §4.3.1, p. 92. From the real eFundi Test 4." },
  { ref:"U1-32", q:"“It explains the present education system and practice: present education is a ‘crystallised reality’.” This is the:",
    o:["practical value of History of Education","theoretical value of History of Education","intrinsic value of History of Education","economic value of education","If not one of these, mark here"], c:1,
    why:"Explaining the present as a crystallised reality is the theoretical value. The practical value is about solving today’s problems.",
    src:"QC 2 slide 49 (Ch 1: the value of History of Education)" },
  { ref:"X-01", q:"Which of these happened in 1960?",
    list:["Africa’s adult literacy rate was about 9%","The Sharpeville massacre","The Addis Ababa meeting","The whites-only republic referendum"],
    o:["A and B","A, B and D","C and D","All of these","None of these"], c:1,
    why:"1960: literacy about 9% (end of the colonial era), Sharpeville, and the republic referendum. The Addis Ababa meeting was 1961. Tick, count (three), take the combo with three. The option letters on screen are shuffled, so ignore them.",
    src:"Textbook §3.6, §3.8, §4.9" },
  { ref:"U3-34", q:"Africa’s total debt rose from $14 billion (1973) to how much by 1987?",
    o:["$48 billion","$90 billion","$125 billion","$978 billion","If not one of these, mark here"], c:2,
    why:"$125 billion by 1987. By the mid-1980s loan payments took about half of Africa’s export earnings.",
    src:"Textbook §3.10" },
  { ref:"U2-11", q:"Which is NOT one of the Seven Liberal Arts?",
    o:["Dialectics (logic)","Geometry","Theology","Arithmetic","If all of these are liberal arts, mark here"], c:2,
    why:"Theology is not one of them. The Seven Liberal Arts are grammar, rhetoric and dialectics, plus arithmetic, geometry, astronomy and music.",
    src:"Textbook Ch 2: the Seven Liberal Arts" },
  { ref:"U4-36", q:"What was the main challenge for education after 1994? Choose the MOST correct answer.",
    o:["Affordable education.","Affordable education for a broad community without sacrificing quality and standards.","Keeping standards high.","Building more schools."], c:1,
    why:"The fullest answer wins: affordable education for a broad community, without sacrificing quality and standards. The short ones are each only half of it.",
    src:"QC 8 slide 7 (Ch 4: post-1994 education)" },
  { ref:"ART-u1c-Q10", q:"Which type of value relates to the manner in which an individual guides his/her emotions and feelings such as sensitivity, friendliness, joy, stability and attitudes?",
    o:["Self-values","Affective/emotional values","Social values","Moral values","If not one of these, mark here"], c:1,
    why:"Guiding emotions and feelings = affective/emotional values. The favourite swap is self-values, which are about how you relate to yourself as a person.",
    src:"QC 2 slides 42 and 46 (Ch 1: types of values)" },
  { ref:"E3-Q8", q:"The schools in ancient Egypt were (mark the wrong statement):",
    o:["Reading, writing and arithmetic were taught.","The education was elementary in nature.","The boys who attended were a very small elite.","If all are true, mark here"], c:3,
    why:"All three lines are in the book: elementary schools teaching reading, writing and arithmetic to a very small elite. No F, so mark here.",
    src:"Textbook Ch 3, p. 66. From the real eFundi Test 3." },
  { ref:"E2-Q19", q:"______ (470 BC to 399 BC) wandered in the streets and on the city squares of Athens, and posed questions to young men, such as “What is knowledge?”, “What is virtue?”, “What is the purpose of life?” and “What is honesty?”",
    o:["Diogenes","Socrates","Plato","Xenophon","Aristotle"], c:1,
    why:"Socrates, the questioner of Athens. Plato was his student, and Aristotle was Plato’s student.",
    src:"Textbook Ch 2, p. 29. From the real eFundi Test 2." },
  { ref:"U4-15", q:"The Cape School Board Act of 1905:",
    o:["excluded coloured children from compulsory education","opened schools to all races","made Dutch compulsory","created Model C schools","If not one of these, mark here"], c:0,
    why:"The 1905 school-board law excluded coloured children from compulsory education. Model C schools came much later (1992).",
    src:"Textbook §4.5" },
  { ref:"U1-41", q:"KwaZulu-Natal floods stop children from reaching school, so class sizes go up and down. Which external determinant is at work?",
    o:["Demographical tendencies","Geographical characteristics","Political systems","Social systems","If not one of these, mark here"], c:1,
    why:"Floods are about the land and the climate: geographical characteristics. The trap is demographical tendencies, because class sizes change, but the cause here is the weather, not the population.",
    src:"Textbook Ch 1: external determinants" },
  { ref:"ART-u3a-Q15", q:"Which of the following was NOT part of the Addis Ababa Plan?",
    o:["Education should be relevant to Africa, with Africa’s natural and cultural heritage in textbooks and curricula","Adult illiteracy should be eradicated","The expansion of teacher education should be a priority","Indigenous African languages should be developed as Languages of Learning and Teaching, replacing the ex-colonial languages","If all were part of the plan, mark here"], c:3,
    why:"Developing indigenous African languages as LoLT came later, at the Nairobi meeting of 1968. The other three are all in the Addis Ababa Plan.",
    src:"Textbook §3.8 and §3.9.5" },
  { ref:"U2-06", q:"The earliest excavated classroom, from about 2000 BC, was found in a temple.",
    o:["True","False"], c:1, tf:true,
    why:"False. It was found in a palace. One word swapped.",
    src:"Textbook Ch 2: the first schools" },
  { ref:"E4-Q12", q:"The Voortrekker tradition of education during the 19th century included (which statement is wrong?):",
    o:["Learning prepared the children for membership of the church.","One of the reasons for the Great Trek was the Anglicisation policy of the British government.","Education was the responsibility of the parents.","The language of learning and teaching was English.","If all are correct, mark here"], c:3,
    why:"The Trekkers left partly to get away from Anglicisation, so English as their teaching language is the planted false line. The other three are on the page.",
    src:"Textbook §4.4, p. 96. From the real eFundi Test 4." },
  { ref:"U1-27", q:"Values that relate to the way an individual strives for wealth (money, property, high living standards) are:",
    o:["Occupational values","Economic values","Security values","Authoritarian values","If not one of these, mark here"], c:1,
    why:"Striving for wealth = economic values. Occupational values are about your attitude to your job.",
    src:"Textbook Ch 1: types of values" },
  { ref:"U3-40", q:"Judging the Addis Ababa Plan from 2026, which view is best supported by the textbook?",
    o:["It failed completely; enrolments hardly grew.","It was a complete success; every target was met by 1980.","Its targets were very ambitious; linear expansion raised enrolments spectacularly but hurt quality, so a steep climb to a knowledge economy remains.","It should have ignored teacher education."], c:2,
    why:"The book calls the enrolment growth “nothing short of miraculous”, but quality stayed very low. So the balanced view is best: big growth, poor quality, a long way still to go.",
    src:"Textbook §3.9.1, §3.12" },
  { ref:"FIX-E2-Q22", q:"The big drawing card (attracting many students from all over Europe) at the University of Paris was Professor Google, later assisted by his student Siri.",
    o:["True","Usually","False"], c:2, tf:true,
    why:"False, of course. It was Professor Abelard, later assisted by his student Peter the Lombard. A free mark, to breathe.",
    src:"Textbook Ch 2, p. 36. From the real eFundi Test 2 (names replaced)." },
  { ref:"U4-24", q:"The De Lange Report (1981) came out of an investigation by:",
    o:["SAQA","the HSRC","the Eiselen Commission","the Erika Theron Commission","If not one of these, mark here"], c:1,
    why:"The HSRC investigation (1980) produced the De Lange Report (1981), which led to Act No. 76 of 1984. The Eiselen Commission came before Bantu Education.",
    src:"Textbook §4.8.1" },
  { ref:"ART-u1b-Q15", q:"The history of the teaching profession is called its “conscience” because it:",
    o:["shows how ever-changing values shaped a value-driven profession","records the names of every teacher who transgressed","proves that education never changes","replaces the need for a professional code of conduct"], c:0,
    why:"Teaching is a value-driven profession, and its history shows how ever-changing values shaped it. That is what makes history its conscience.",
    src:"Textbook Ch 1: the value of History of Education" },
  { ref:"U3-11", q:"The University of Alexandria was destroyed in:",
    o:["332 BC","640 AD","732 AD","859 AD","If not one of these, mark here"], c:1,
    why:"640 AD, by Islam, as a pagan institution. 859 AD is the founding of Al-Karaouine in Fez.",
    src:"Textbook §3.4" },
  { ref:"U2-28", q:"The Reformation ran from:",
    o:["1453 to 1517","1517 to 1648","1450 to 1650","1648 to 1763","If not one of these, mark here"], c:1,
    why:"1517 to 1648. 1450 to 1650 is the Renaissance, the favourite swap.",
    src:"Textbook Ch 2: the Reformation" },
  { ref:"E4-Q3", q:"Three distinct phases can be identified in Cape Colony education during British rule. Which of the following is NOT one of them?",
    o:["The introduction of an Anglicisation policy.","Measures to ensure the formalisation of education through legislation.","The expansion of the provision of education according to established policy.","If all statements are correct, mark here"], c:3,
    why:"All three are the book’s own list of phases (expansion, Anglicisation, formalisation through legislation). No F, so mark here.",
    src:"Textbook §4.3.1, pp. 90 to 91. From the real eFundi Test 4." },
  { ref:"U1-09", q:"Which of the following is NOT one of the learner’s roles in life?",
    o:["Self-actualising individual","Member of communities in society","Consumer of goods and services","Citizen of a country","If all of these are roles in life, mark here"], c:2,
    why:"Consumer of goods and services is not on the list. The six roles: member of a family, member of communities in society, citizen of a country, vocational person, utiliser of leisure time, self-actualising individual.",
    src:"Textbook Ch 1: education and the roles in life" },
  { ref:"ART-u3a-Q17", q:"Which statement is the MOST correct explanation of why the quality of education in Africa suffered during the 1980s?",
    o:["Government spending on education fell","Enrolments kept growing","Government education spending fell (US$10 billion to US$8.9 billion, 1980 to 1983) while enrolments kept growing","Enrolments collapsed after the 1973 oil crisis","If not one of these, mark here"], c:2,
    why:"Falling spending and rising enrolments are both true, but each is only half of the cause. The fullest option joins them. Enrolments did not collapse; they kept growing.",
    src:"Textbook §3.10" },
  { ref:"P-X1", q:"Which pair is matched CORRECTLY?",
    o:["University of Bologna: Theology","Lovedale: the Glasgow Mission","ZINTEC: Kenya","Grey College: Cape Town","If no pair is correct, mark here"], c:1,
    why:"Lovedale was founded by the Glasgow Mission. Bologna = Law, ZINTEC = Zimbabwe, Grey College = Bloemfontein.",
    src:"Textbook Ch 2, §4.2.2.2, §3.9.4, §4.7.2" },
  { ref:"U4-43", q:"A separate Department of Higher Education was created in:",
    o:["1995","1997","May 2009","2015","If not one of these, mark here"], c:2,
    why:"May 2009. 1995 is the first White Paper, and 1997 is the Higher Education Act.",
    src:"Textbook §4.10" },
  { ref:"ART-u2a-Q2", q:"Schools first appear in a society when:",
    o:["it becomes too complex for children to reach adulthood through informal education alone","its government decides all children must be literate","its religion requires reading of sacred texts","it builds its first permanent cities"], c:0,
    why:"Schools arise once a society becomes too complex for children to be raised to adulthood informally. Writing made the first schools possible, but the underlying condition is how complex the society is.",
    src:"Textbook Ch 2: the first schools" },
  { ref:"U1-31", q:"A person is born with values as such.",
    o:["True","False"], c:1, tf:true,
    why:"False. A person is born with the potential for a value-consciousness, not with the values themselves.",
    src:"QC 2 slide 29 (Ch 1: values)" },
  { ref:"U3-15", q:"Which is NOT a criticism of Christian missionary education in Africa?",
    o:["It educated children in an alien, European culture.","It cultivated a mentality of submission.","It allegedly paved the way for colonisation.","It offered secondary and higher education to most children.","If all of these are criticisms, mark here"], c:3,
    why:"Missionary education reached very few children, and mostly only the first few grades. The other three are the criticisms in the book.",
    src:"Textbook §3.5" },
  { ref:"U4-53", q:"After 1994, many analysts argue that racial segregation was simply replaced by:",
    o:["language segregation","socio-economic segregation","religious segregation","provincial segregation","If not one of these, mark here"], c:1,
    why:"Socio-economic segregation: desegregation was a one-way process, so the schools now divide by who can afford them.",
    src:"QC 8 slide 17 (Ch 4: post-1994 education)" },
  { ref:"E2-Q25", q:"Socrates and Aristotle laid the foundation for the two basic epistemological traditions in the West, namely rationalism and empiricism, which influenced education.",
    o:["True","False"], c:1, tf:true,
    why:"False. It was Plato and Aristotle (look back at Question 7). One name swapped in a line you already met: check every name again.",
    src:"Textbook Ch 2, p. 30. From the real eFundi Test 2." },
  { ref:"ART-u1a-Q11", q:"Why must a South African teacher know education policy?",
    o:["in a judicial state, adherence to policy is tested in court: “I didn’t know” is no excuse","policy knowledge is only required of principals and departmental officials","policy only matters when a teacher applies for promotion","teachers write the national policy themselves"], c:0,
    why:"South Africa is a judicial state: adherence to policy is tested in court, and “I didn’t know” is no defence. Policy knowledge is not optional, and not only for principals.",
    src:"Textbook Ch 1: education system policy" },
  { ref:"ART-u3a-Q18", q:"Between 1960 and 1970 public expenditure on education doubled, and education became the biggest single item on African government agendas, at approximately ___ of budgets.",
    o:["a quarter","half","a tenth","three quarters","If not one of these, mark here"], c:0,
    why:"About a quarter. The near-half figure in the book is Côte d’Ivoire’s 45.8% in 1988: the extreme case, and decades later.",
    src:"Textbook §3.9" },
  { ref:"U2-35", q:"Which country was a LATE starter with a national primary system?",
    o:["Prussia (1763)","France (1833)","USA, Massachusetts (1852)","England (1902)","If not one of these, mark here"], c:3,
    why:"England, only in 1902 (the Balfour Act). Prussia, France and Massachusetts were all earlier.",
    src:"Textbook Ch 2: national school systems" },
  { ref:"E4-Q15", q:"Adults of the indigenous communities in the pre-1650s had extensive responsibilities to transmit cultural values and skills to the younger generations.",
    o:["True","False"], c:0, tf:true,
    why:"True. Adults in the Khoi, San and black communities had extensive responsibilities to pass on cultural values and skills. “Pre-1650s” just means before colonial times (1652).",
    src:"Textbook §4.1, p. 86. From the real eFundi Test 4." }
  ]},
{ id:"t3", num:3, title:"Test 3", ready:true,
  desc:"Mixed units 1 to 4. Includes a variant of the Africa-reasons exam question.",
  qs:[
  { ref:"U4-28", q:"Most white government schools became state-supported Model C schools in:",
    o:["1990","1991","1992","1994","If not one of these, mark here"], c:2,
    why:"1992. White government schools opened to all races in 1991 (announced on 2 February 1990), and in 1992 most of them became Model C schools. 1994 is the first democratic election.",
    src:"Textbook §4.10" },
  { ref:"U1-01", q:"Education (Steyn & Wolhuter, 2014) refers to those deliberate, purposeful and planned activities through which educators support learners to acquire the required and agreed-upon competencies to fulfil their roles in life.",
    o:["True","False"], c:0, tf:true,
    why:"True. This is the textbook’s definition of education: competencies for ALL the roles in life. Training is narrower: one particular skill, role or career.",
    src:"Textbook Ch 1: defining education" },
  { ref:"U2-08", q:"In Ancient Athens, the Palestra provided:",
    o:["physical education, with the Pentathlon as curriculum","the Seven Liberal Arts","rhetoric for civil servants","religious instruction","If not one of these, mark here"], c:0,
    why:"The Palestra was the physical-education school, with the Pentathlon as its curriculum. The Didascaleum was the culture school (the Seven Liberal Arts). Rhetoric for civil servants is the Roman rhetorical school.",
    src:"Textbook Ch 2: Ancient Greece (Athens)" },
  { ref:"U3-24", q:"At independence, about what share of Africa’s teachers were unqualified?",
    o:["a quarter","a third","half","three quarters","If not one of these, mark here"], c:2,
    why:"About half of Africa’s teachers were unqualified at independence. That is why fast-tracking teacher education mattered so much afterwards.",
    src:"Textbook §3.8" },
  { ref:"ART-u1b-Q7", q:"An education system is defined as a structure for:",
    o:["the effective supply of education to meet the needs of a target group in a geographic area","the training of teachers by the national government","transferring values from one generation to the next","administering examinations across a country"], c:0,
    why:"A structure for the effective supply of education to meet the needs of a target group in a geographic area. When the target group is a whole country’s population, it is a national education system.",
    src:"Textbook Ch 1: the education system" },
  { ref:"U4-11", q:"Which was NOT one of the Cape commissions of enquiry?",
    o:["Fairbairn (1854)","Watermeyer (1863)","Eiselen","Barry (1891)","If all of these were Cape commissions, mark here"], c:2,
    why:"The Eiselen Commission is the impostor: it investigated black education and led to Bantu Education. Fairbairn, Watermeyer and Barry were Cape commissions.",
    src:"Textbook §4.3.1, §4.8.1" },
  { ref:"E2-Q12", q:"Developments in education during the Middle Ages were the following. Which is incorrect?",
    o:["The rise of universities during the middle centuries of the Middle Ages.","The origin of Saracen or Islam education towards the end of the Middle Ages.","Monastic education in the early Middle Ages.","If all are correct, mark here."], c:3,
    why:"All three are in the book: monastic education (early Middle Ages), the rise of universities (middle centuries) and Saracen or Islam education. No impostor, so mark here.",
    src:"Textbook Ch 2, p. 34. From the real eFundi Test 2." },
  { ref:"U3-02", q:"The reasons for studying the history of education in Africa include the following. Which statement is incorrect?",
    o:["South Africa can learn from successful adult literacy campaigns and fast-tracked teacher education elsewhere in Africa.","In times of “African pessimism”, few realised that Africa had the biggest education expansion in human history.","Africa needs a world-class education sector as it moves towards a knowledge society.","Challenges in SA education, like poor physical facilities and adult illiteracy, also exist elsewhere in Africa.","If all of these are correct, mark here"], c:4,
    why:"All four are reasons the book gives, so mark here. This is a variant of the real exam question: read every line for one swapped word before you decide there is none.",
    src:"Textbook §3.1" },
  { ref:"U1-05", q:"“Imprinting ideas or dogmas wilfully and in a biased way, where learners are expected not to question” describes:",
    o:["Forming","Coaching","Indoctrination","Teaching","If not one of these, mark here"], c:2,
    why:"Indoctrination: deliberate, biased, and no questioning allowed. Forming is different: environmental influence on a child who has no real choice.",
    src:"Textbook Ch 1: activity-concepts" },
  { ref:"U4-35", q:"A communal value system marked by democracy, equality, freedom, peace, justice, tolerance and stability is one of the goals of post-1994 education. This goal is called the:",
    o:["social goal","cultural goal","political goal","economic goal","If not one of these, mark here"], c:4,
    why:"It is the nation-building goal, which is not listed, so mark here. The social goal is a society free of unfair discrimination; the political goal is empowering citizens to take part in a democracy.",
    src:"Textbook §4.10, QC 8 slide 6" },
  { ref:"ART-u2b-Q15", q:"Japan built its national education system beyond the West from 1868, under the:",
    o:["Meiji restoration","rule of Mustafa Kemal","November revolution","Balfour Act"], c:0,
    why:"The Meiji restoration (1868). Turkey followed under Mustafa Kemal (1923); the USSR set up its Ministry of Education a day after the November 1917 revolution. The Balfour Act is England (1902).",
    src:"Textbook Ch 2: national school systems" },
  { ref:"ART-u3a-Q12", q:"On Independence Day in 1966, Botswana had a mere:",
    o:["22 university graduates and 100 secondary-school graduates","100 university graduates and 22 secondary-school graduates","22 secondary schools and 100 primary schools","22 qualified teachers for the whole country","If not one of these, mark here"], c:0,
    why:"22 university graduates and 100 secondary-school graduates: the book’s extreme case of colonial neglect. The trap reverses the two numbers.",
    src:"Textbook §3.6" },
  { ref:"E1-Q2", q:"The intrinsic or primary object of study of the History of Education is the study of the educational past.",
    o:["True","False"], c:0, tf:true,
    why:"True, as the book says it. It smells like a trap but is correctly labelled. The swap to watch for is “understanding the phenomenon of Education”: that is the final goal, not the primary object.",
    src:"Textbook §1.6, p. 20. From the real eFundi Test 1." },
  { ref:"U4-46", q:"In the textbook, the Senior Phase covers:",
    o:["Gr 1 to 3","Gr 4 to 6","Gr 7 to 9","Gr 10 to 12","If not one of these, mark here"], c:2,
    why:"Senior Phase = Gr 7 to 9. Foundation is Gr 1 to 3, Intermediate is Gr 4 to 6, and FET is Gr 10 to 12.",
    src:"Textbook §4.10" },
  { ref:"U2-14", q:"Plato founded empiricism: knowledge comes to us through the senses.",
    o:["True","False"], c:1, tf:true,
    why:"False. Plato stands for rationalism (his Theory of Ideas or Forms). Aristotle is the empiricist: knowledge through the senses.",
    src:"Textbook Ch 2: Plato and Aristotle" },
  { ref:"U3-07", q:"Which statement about formal schools in Ancient Egypt is the MOST correct?",
    o:["They were set up between 3000 BC and 2000 BC.","They were elementary schools, set up between 3000 BC and 2000 BC, for a very small elite of boys training as priests and scribes.","They taught priests and scribes.","They were for boys only."], c:1,
    why:"Each short option is true but only part of the picture. The fullest one joins them: elementary schools, 3000 to 2000 BC, a very small elite of boys training as priests and scribes.",
    src:"Textbook §3.2" },
  { ref:"U1-19", q:"Which is NOT one of the external determinants of the education system?",
    o:["Social systems","Financial and economic tendencies","Science and technology tendencies","Political systems","If all of these are external determinants, mark here"], c:4,
    why:"All four are external determinants, so mark here. The full seven: geographical characteristics, demographical tendencies, social systems, financial and economic tendencies, science and technology tendencies, political systems, and worldview and religion.",
    src:"Textbook Ch 1: external determinants" },
  { ref:"P-X3", q:"Which year marks both the end of the colonial era in Africa (Ch 3) and the whites-only republic referendum in South Africa (Ch 4)?",
    o:["1948","1960","1961","1976","If not one of these, mark here"], c:1,
    why:"1960: the end of the colonial era (adult literacy about 9%) and the republic referendum. 1961 is the Addis Ababa meeting, 1948 the year the National Party came to power, 1976 the Soweto uprising.",
    src:"Textbook §3.6, §4.9" },
  { ref:"U2-30", q:"The doctrine of formal discipline (“mental gymnastics” with mathematics and classical languages) belongs to:",
    o:["Realism","Rationalism","Naturalism","Humanism","If not one of these, mark here"], c:1,
    why:"Rationalism (Descartes), taught in the Grammar school or Gymnasium. Realism is Comenius; Naturalism is Rousseau; Humanism is Erasmus.",
    src:"Textbook Ch 2: Rationalism" },
  { ref:"U3-16", q:"Africa was divided into colonies in the last quarter of the 19th century. Which of these was NOT one of the colonial powers listed in the textbook?",
    o:["Great Britain","France","The Netherlands","Portugal","If all of these were listed, mark here"], c:2,
    why:"The textbook lists Great Britain, France, Spain, Portugal and Germany. The Netherlands is the trap: the Dutch belong to the Cape story in Ch 4.",
    src:"Textbook §3.6" },
  { ref:"ART-u1a-Q5", q:"A netball coach improves the team’s shooting through repeated drills aiming at precision. This is:",
    o:["coaching","training","conditioning","teaching"], c:0,
    why:"Improving performance and skills through repeated exercise, aiming at precision in predetermined actions (sport, an orchestra), is coaching. Training prepares for one particular role or career; conditioning is stimulus-response.",
    src:"Textbook Ch 1: activity-concepts" },
  { ref:"U4-06", q:"The London Mission Society was the first mission society to arrive in South Africa.",
    o:["True","False"], c:1, tf:true,
    why:"False. The Moravians were the first; the London Mission Society was the best known.",
    src:"Textbook §4.2.2.1" },
  { ref:"U2-25", q:"Which of these happened in 1453?",
    list:["The fall of Constantinople","Gutenberg’s invention of printing","Luther’s 95 objections","The Peace of Westphalia"],
    o:["A and B","A, B and C","C and D","All of these","None of these"], c:0,
    why:"1453: Constantinople fell and Gutenberg invented printing. Luther’s 95 objections were 1517 and the Peace of Westphalia 1648. Tick, count (two), take the combo with two. The option letters on screen are shuffled, so ignore them.",
    src:"Textbook Ch 2: the Renaissance" },
  { ref:"E3-Q14", q:"The Addis Ababa Plan for Education included the following. Which statement is NOT correct?",
    o:["Adult illiteracy should be eradicated.","Education should be aligned to the economic needs of Africa.","The expansion of teacher education had to be a priority.","Curricula and textbooks should especially be relevant to the education needs of Africa.","If all are true, mark here"], c:4,
    why:"All four are in the plan, so mark here. The easy wrong pick is the textbooks line, but the book says Africa’s natural and cultural heritage should be reflected in textbooks and curricula. (The book itself prints “adult literacy should be eradicated”: it means illiteracy.)",
    src:"Textbook Ch 3, p. 71. From the real eFundi Test 3." },
  { ref:"U1-24", q:"“The disposition that directs an individual’s attitude towards his/her occupation: job satisfaction, success, skilfulness, being hard-working.” These are:",
    o:["Economic values","Occupational values","Self-values","Intellectual values","If not one of these, mark here"], c:1,
    why:"Occupational values: your attitude towards your occupation. The neighbour trap is economic values, which are about striving for wealth.",
    src:"Textbook Ch 1: types of values" },
  { ref:"U4-55", q:"The Rhodes Must Fall and #FeesMustFall movements began in:",
    o:["1976","1994","2009","2015","If not one of these, mark here"], c:3,
    why:"2015. 1976 is the Soweto uprising, 1994 the first democratic election, and 2009 the separate Department of Higher Education.",
    src:"Textbook §4.11" },
  { ref:"ART-u2b-Q9", q:"The kindergarten movement grew from the work of:",
    o:["Pestalozzi and Fröbel","Herbart and Dewey","Luther and Calvin","Bacon and Locke"], c:0,
    why:"Pestalozzi (1746 to 1827) and Fröbel (1782 to 1852) set up the trail-blazing pre-primary schools (kindergartens). Herbart built the listen school; Dewey the work school.",
    src:"Textbook Ch 2: pre-primary education" },
  { ref:"FIX-ART-u3a-Q16", q:"The most noteworthy new education model of the 1960s was “Education for Self-Reliance”, launched by a famous TikTok influencer.",
    o:["True","False"], c:1, tf:true,
    why:"False, and a free mark: it was Julius Nyerere of Tanzania (1967), since completely abandoned. Most countries chose linear expansion (“more of the same”) instead of new models.",
    src:"Textbook §3.9.1" },
  { ref:"U1-35", q:"Which statement about the value of studying History of Education is the MOST correct?",
    o:["It explains the present education system.","It helps to design a future education dispensation.","It has a theoretical value (explaining the present as a crystallised reality), a practical value (elucidating current problems, designing the future, experiences in a nutshell) and an intrinsic value (satisfying the human need for knowledge).","It satisfies the human need for knowledge."], c:2,
    why:"The short options are each one value. The fullest one names all three: theoretical (the present), practical (problems and the future) and intrinsic (the need for knowledge).",
    src:"Textbook Ch 1: the value of History of Education" },
  { ref:"E4-Q18", q:"After 1806, Britain did the following. Which statement is NOT true?",
    o:["Took control of the Cape","Imported teachers from Britain","English became the medium of instruction","Built more and better schools in the Cape Colony","If all are true, mark here"], c:4,
    why:"All four come straight from the book: in 1806 Britain took control of the Cape, English became the medium of instruction, teachers were imported from Britain, and more and better schools were built. No impostor, so mark here.",
    src:"Textbook §4.3.1, p. 90. From the real eFundi Test 4." },
  { ref:"U2-41", q:"Which is NOT one of the three pillars of Western civilisation?",
    o:["Athens","Rome","Jerusalem","Alexandria","If all of these are pillars, mark here"], c:3,
    why:"The book’s three ground pillars are Athens, Rome and Jerusalem. Alexandria was a great centre of learning (Ch 3), but not one of the pillars.",
    src:"Textbook Ch 2" },
  { ref:"U3-28", q:"The Botswana National Literacy Programme (1980) is Bhola’s example of the:",
    o:["project approach","programme approach","campaign approach","poly-technical approach","If not one of these, mark here"], c:1,
    why:"The programme approach. Bhola’s campaign example is Somalia. Poly-technical education is a work-related initiative, not a literacy approach.",
    src:"Textbook §3.9.2" },
  { ref:"ART-u1b-Q19", q:"A key property of values is that only human beings have:",
    o:["value consciousness","stimulus-response reflexes","the ability to learn","a need for support services"], c:0,
    why:"Only humans can develop a value-consciousness. People are not born with values as such, only with the potential for a value-consciousness.",
    src:"Textbook Ch 1: properties of values" },
  { ref:"U4-37", q:"The first White Paper (1995) consolidated how many departments of education into one?",
    o:["4","9","15","19","If not one of these, mark here"], c:3,
    why:"19 departments became one. 9 is the trap: that is the number of provinces.",
    src:"Textbook §4.10" },
  { ref:"ART-u2b-Q11", q:"Dewey’s “work school” is described in the textbook as:",
    o:["student-activity-centred, but a passing fad","teacher-centred and still dominant","the model for national primary systems","the first school built on scientific psychology"], c:0,
    why:"Student-activity-centred, but in the end a passing fad, today all but forgotten. Herbart’s teacher-centred listen school is the one that persisted.",
    src:"Textbook Ch 2: the 20th century" },
  { ref:"U3-10", q:"At Alexandria, Archimedes identified and named the parts of speech.",
    o:["True","False"], c:1, tf:true,
    why:"False. That was Aristarchus. Archimedes is physics, Euclid is geometry, and Eratosthenes calculated the size of the earth.",
    src:"Textbook §3.3" },
  { ref:"X-03", q:"Missionary schools in Africa (Ch 3) and in South Africa (Ch 4) had a similar aim. Which answer is MOST correct?",
    o:["To teach agriculture.","To convert people to Christianity and teach them to read and write so they could read the Bible, offering mostly elementary education only.","To teach the three Rs.","To prepare learners for university."], c:1,
    why:"In both chapters the aim is the same: convert people, and teach them to read and write so they could read the Bible, mostly at elementary level only. The three Rs are part of it, not the whole.",
    src:"Textbook §3.5, §4.2.2.1" },
  { ref:"U1-13", q:"Which is NOT a part-discipline of Education (the science)?",
    o:["Philosophy of Education","Political Science","History of Education","Educational Psychology","If all of these are part-disciplines, mark here"], c:1,
    why:"Political Science is a separate science. Philosophy of Education, History of Education and Educational Psychology are part-disciplines of Education.",
    src:"Textbook Ch 1: History of Education as a part-discipline" },
  { ref:"U4-17", q:"At Union (1910), the only province that made provision for Indian education was:",
    o:["the Cape","Natal","the Transvaal","the Free State","If not one of these, mark here"], c:1,
    why:"Natal. The Free State banned Indians altogether.",
    src:"Textbook §4.6" },
  { ref:"U2-22", q:"The main teaching method of the medieval university was the lecture, from the Latin lectio, meaning:",
    o:["I speak","I read","I teach","I write","If not one of these, mark here"], c:1,
    why:"Lectio means “I read”.",
    src:"Textbook Ch 2: medieval universities" },
  { ref:"ART-u3a-Q5", q:"Which of the following is NOT correct about decolonisation in Africa?",
    o:["Between 1950 and 1975 a strong wave of nationalism swept Africa","Post-war debt made it hard for European countries to afford maintaining colonies","All African countries achieved independence non-violently","In eastern and southern Africa, large European settler communities suppressed independence movements","If all are correct, mark here"], c:2,
    why:"Paths differed: some countries achieved independence non-violently, while others (for example Tunisia and Morocco) had to forcefully regain self-rule. “All” overreaches.",
    src:"Textbook §3.13" },
  { ref:"E1-Q23", q:"Which of the following is one of the roles in life a learner is prepared for? Choose the most correct option.",
    o:["Friend","Former learner","Pensioner","Self-actualising individual","If not one of these, mark here"], c:3,
    why:"Self-actualising individual is one of the six roles in life (with member of a family, citizen of a country, vocational person, member of communities in society and utiliser of leisure time). The other three are made up.",
    src:"Textbook Ch 1: education and the roles in life. From the real eFundi Test 1." },
  { ref:"U4-29", q:"Non-white learners in historically white schools grew from about 7 923 at the start of 1992 to how many by the end of 1993?",
    o:["8 000","80 000","800 000","736 105","If not one of these, mark here"], c:1,
    why:"About 80 000 by the end of 1993, roughly ten times as many in two years.",
    src:"Textbook §4.10" },
  { ref:"ART-u2b-Q19", q:"During the Renaissance, the privilege of education (the educational public) was expanded to include:",
    o:["the sons of the aristocracy","all children, in principle","the clergy","girls and slaves"], c:0,
    why:"The sons of the aristocracy. In the Middle Ages the educational public was limited to the clergy. Elementary education for all, in principle, came with the Reformation.",
    src:"Textbook Ch 2: the Renaissance" },
  { ref:"U3-36", q:"Which country nationalised education and banned private schooling after independence?",
    o:["Angola","Tanzania","Botswana","Morocco","If not one of these, mark here"], c:1,
    why:"Tanzania nationalised education and banned private schooling.",
    src:"Textbook §3.11" },
  { ref:"U1-02", q:"Training refers to those deliberate, purposeful and planned activities through which educators support learners to acquire the required and agreed-upon competencies to fulfil their roles in life.",
    o:["True","False"], c:1, tf:true,
    why:"False. That is the definition of EDUCATION (Question 2 had it right). One word was swapped. Training is for one particular skill, role or career.",
    src:"Textbook Ch 1: defining education" },
  { ref:"U4-48", q:"Under OBE, external assessment took place only at the end of:",
    o:["Gr 7 and Gr 12","Gr 9 and Gr 12","every phase","Gr 12 only","If not one of these, mark here"], c:1,
    why:"Only at the end of Gr 9 and Gr 12. Otherwise assessment was continuous and formative.",
    src:"Textbook §4.10" },
  { ref:"U2-40", q:"The “Triangle of Revolutions” consists of:",
    o:["the Industrial, American and French revolutions","the Russian, French and American revolutions","the Scientific, Industrial and ICT revolutions","the Renaissance, Reformation and Enlightenment","If not one of these, mark here"], c:0,
    why:"The Industrial, American (1776) and French revolutions.",
    src:"Textbook Ch 2" },
  { ref:"ART-u3a-Q10", q:"Colonial schools provided just enough education to train people for auxiliary/subsidiary positions, namely:",
    o:["clerks, interpreters, policemen, soldiers, preachers","clerks, policemen, soldiers","teachers, nurses, clerks and engineers","priests and scribes","If not one of these, mark here"], c:0,
    why:"The fullest wording wins: clerks, interpreters, policemen, soldiers and preachers. The shorter list is not false, only incomplete. Priests and scribes belong to Ancient Egypt.",
    src:"Textbook §3.6" },
  { ref:"U4-58", q:"In 1975 the vernacular (home language) in black schools was restricted to:",
    o:["Std 2","Std 4","Std 6","Std 8","If not one of these, mark here"], c:1,
    why:"Std 4. From Std 5 up, teaching was 50/50 in English and Afrikaans, the biggest grievance behind the Soweto uprising of 1976.",
    src:"Textbook §4.8.1" }
  ]},
{ id:"t4", num:4, title:"Test 4", ready:true,
  desc:"Mixed units 1 to 4. Includes a MOST-correct variant of the Africa-reasons exam question.",
  qs:[
  { ref:"U2-12", q:"In Athens, the boys were escorted by a Pedagogus, who was:",
    o:["a trusted slave","a priest","the boy’s father","a hired philosopher","If not one of these, mark here"], c:0,
    why:"A Pedagogus was a reliable slave who went everywhere with the boys, supervised them and taught them good manners. He was not a teacher of philosophy.",
    src:"Textbook Ch 2: Ancient Greece (Athens)" },
  { ref:"U4-04", q:"The first school mainly for white children (1663) had 12 white children, 4 slave children and:",
    o:["1 Khoikhoi child","4 Khoikhoi children","12 Khoikhoi children","no other children","If not one of these, mark here"], c:0,
    why:"12 white children, 4 slave children and 1 Khoikhoi child. The trap is to copy the 4 or the 12 from the stem.",
    src:"Textbook §4.2.1" },
  { ref:"E3-Q7", q:"Egyptians developed the art of written communication. This art was used to record the needs of commerce, agriculture and government.",
    o:["True","False"], c:0, tf:true,
    why:"True. The book says the Egyptians perfected written communication to such an extent that it was used to record the needs of commerce, agriculture and government.",
    src:"Textbook Ch 3, p. 66. From the real eFundi Test 3." },
  { ref:"U1-03", q:"Which activity-concept is built on stimulus-response theory?",
    o:["Forming","Indoctrination","Coaching","Conditioning","If not one of these, mark here"], c:3,
    why:"Conditioning works by stimulus and response. Coaching is repeated exercise for precision; forming is environmental influence; indoctrination is biased imprinting of dogmas.",
    src:"Textbook Ch 1: activity-concepts" },
  { ref:"ART-u2a-Q13", q:"During the Middle Ages, monastery libraries were important because they:",
    o:["preserved the Greek-Roman manuscripts destroyed elsewhere","printed the first books in the vernacular","lent books to all citizens of the town","trained civil servants for the empire"], c:0,
    why:"Monastery libraries kept the Greek-Roman manuscripts that were destroyed elsewhere, which later fed the Renaissance. The monastic schools themselves trained monks and nuns for monastic life.",
    src:"Textbook Ch 2: monastic education" },
  { ref:"U4-14", q:"Which statement about education during the Great Trek is wrong?",
    o:["Education was mainly the parents’ responsibility.","The Bible was the main textbook.","Some groups had teachers.","Children were taught in English, the official language.","If all of these are correct, mark here"], c:3,
    why:"The trekkers taught in Dutch from the Bible. Anglicisation was one of the reasons they left the Cape, so English is the impostor.",
    src:"Textbook §4.4" },
  { ref:"U3-06", q:"“African pessimism” has been the dominant world opinion since:",
    o:["1960","the early 1970s","1990","2006","If not one of these, mark here"], c:1,
    why:"Since the early 1970s. 1960 is the trap: that is when the big education expansion began, which few people noticed because of the pessimism.",
    src:"Textbook §3.1" },
  { ref:"U1-29", q:"Which is NOT a property of values (the QC slides)?",
    o:["Values are personal","Values have a universal character","Values are subjective, but may also be objective","Values are influenced by culture","If all of these are properties of values, mark here"], c:4,
    why:"All four are on the properties-of-values list, so mark here. Read every line before you hunt for an impostor that is not there.",
    src:"Textbook Ch 1: properties of values" },
  { ref:"U2-37", q:"Article 26 of the UN Universal Declaration of Human Rights (1948) says (choose the MOST correct answer):",
    o:["Everyone has the right to education.","Education shall be free.","Everyone has the right to education; it shall be free, at least in the elementary stages, and higher education shall be equally accessible on the basis of merit.","Higher education shall be free for all."], c:2,
    why:"The first two are true but only parts of it. The fullest line wins. Higher education is equally accessible on merit, not free for all.",
    src:"Textbook Ch 2: the post-war education expansion" },
  { ref:"E4-Q8", q:"The Dutch settlers came from devout Protestant roots but changed their lifestyle in the Cape region.",
    o:["True","False"], c:1, tf:true,
    why:"False. The book says they came from devout Protestant roots and MAINTAINED a lifestyle based on their religion. One word was swapped.",
    src:"Textbook §4.2.1, pp. 87 to 88. From the real eFundi Test 4." },
